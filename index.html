/* Layout: phone-first app shell. Sticky glass header, scrolling content, fixed glass bottom nav. Appliance stage is a 3D carousel; opening a unit splits stage into appliance + right-side zone menu. */
:root{

  --ok:#4ade80; --ok-bg:rgba(74,222,128,.14); --warn:#fbbf24; --warn-bg:rgba(251,191,36,.16); --bad:#f87171; --bad-bg:rgba(248,113,113,.16);
  --shadow:0 10px 30px rgba(0,0,0,.45); --glow:0 0 0 1px rgba(150,190,255,.12) inset, 0 14px 40px rgba(59,130,246,.22);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070d1a; --bg2:#0b1630; --surface:rgba(20,32,60,.62); --surface-solid:#111c36;
  --fg:#e8eefc; --muted:#8fa0c0; --line:rgba(150,180,255,.14);
  --accent-ink:#06142e; --accent:#5b9bff; --accent-2:#2563eb;

#root{height:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--m1),var(--m2) 45%,var(--m3));box-shadow:var(--glow);color:#fff;font-style:normal}
.glass{background:var(--surface);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:var(--shadow)}

.nav-in{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border-radius:26px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:20px;font-size:12px;font-weight:600;color:var(--muted);position:relative;transition:color .25s,background .25s}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,12,30,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:30px 30px 0 0;background:var(--surface-solid);padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:rise .32s cubic-bezier(.2,.9,.3,1)}

@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(40px);opacity:0}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 14px}
.item-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;text-align:start;width:100%;transition:transform .15s}
.item-row:active{transform:scale(.985)}
.emo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--accent) 10%,transparent);flex:none}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--muted);font-weight:600}
.scroll-x{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroll-x::-webkit-scrollbar{display:none}

.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}

.empty{text-align:center;color:var(--muted);padding:40px 16px}
.fadein{animation:rise .4s cubic-bezier(.2,.9,.3,1) both}
/* ---------- appliances ---------- */
.stage{position:relative;height:430px;perspective:1300px;touch-action:pan-y;user-select:none}
.stage-track{position:absolute;inset:0;transform-style:preserve-3d}
.slot{position:absolute;top:8px;left:50%;width:210px;margin-left:-105px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,filter .4s}
.fr{position:relative;width:210px;height:340px;border-radius:20px;padding:9px;transform-style:preserve-3d;
  background:linear-gradient(100deg,var(--m4),var(--m3) 14%,var(--m2) 38%,var(--m1) 50%,var(--m2) 62%,var(--m3) 86%,var(--m4));
  box-shadow:0 26px 40px -10px rgba(8,42,107,.55),0 0 0 1px rgba(255,255,255,.25) inset,0 2px 0 rgba(255,255,255,.5) inset;display:flex;flex-direction:column;gap:6px}
.fr.sm{width:176px;height:300px}
.sec{position:relative;flex:1;display:flex;gap:4px;transform-style:preserve-3d}
.sec>.interior{position:absolute;inset:0;border-radius:11px;background:linear-gradient(180deg,#e8f2ff,#c9dcf7);box-shadow:inset 0 8px 18px rgba(8,42,107,.35);display:flex;flex-direction:column;justify-content:space-evenly;padding:5px;overflow:hidden}
:root[data-theme="dark"] .sec>.interior{background:linear-gradient(180deg,#27406e,#162a4d)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sec>.interior{background:linear-gradient(180deg,#27406e,#162a4d)}}
.shelf{height:100%;max-height:44px;flex:1;border-radius:6px;border-bottom:3px solid rgba(255,255,255,.75);display:flex;align-items:flex-end;gap:3px;padding:0 4px 2px;transition:background .3s,box-shadow .3s;position:relative;font-size:10px;color:#0f2b63;font-weight:700}
.shelf.on{background:rgba(255,255,255,.55);box-shadow:0 0 0 2px #fff,0 0 18px 2px rgba(96,165,250,.9)}
.shelf .bit{width:12px;height:16px;border-radius:4px 4px 2px 2px;background:var(--c,#2563eb);opacity:.85}
.door{position:relative;flex:1;border-radius:12px;transition:transform .85s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;
  background:linear-gradient(105deg,var(--m3),var(--m2) 30%,var(--m1) 48%,var(--m2) 62%,var(--m3));box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 1px 0 rgba(255,255,255,.7) inset}
.door::after{content:"";position:absolute;top:18%;bottom:18%;width:5px;border-radius:3px;background:linear-gradient(180deg,#eaf3ff,#8fb5e8);box-shadow:0 0 6px rgba(255,255,255,.6)}
.door.dR::after{left:8px}.door.dL::after{right:8px}.door.solo::after{left:8px}
.door.dR{transform-origin:right center}.door.dL{transform-origin:left center}.door.solo{transform-origin:right center}
.open .door.dR,.open .door.solo{transform:rotateY(-72deg)}.open .door.dL{transform:rotateY(72deg)}
.door.hl{box-shadow:0 0 0 2px #fff,0 0 22px 3px rgba(96,165,250,.95)}
.door .dlab{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.4);pointer-events:none}
.drawer{position:relative;flex:1;border-radius:10px;background:linear-gradient(105deg,var(--m3),var(--m2) 30%,var(--m1) 50%,var(--m2) 70%,var(--m3));
  box-shadow:0 0 0 1px rgba(255,255,255,.3) inset,0 1px 0 rgba(255,255,255,.7) inset,0 3px 6px rgba(8,42,107,.35);transition:transform .6s cubic-bezier(.3,.8,.2,1),box-shadow .3s;display:grid;place-items:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.4)}
.drawer::before{content:"";position:absolute;top:7px;width:46%;height:5px;border-radius:3px;background:linear-gradient(180deg,#eaf3ff,#8fb5e8)}
.open .drawer.act{transform:translateZ(46px) translateY(7px) scale(1.03);box-shadow:0 0 0 2px #fff,0 18px 26px rgba(8,42,107,.55),0 0 22px rgba(96,165,250,.9)}
.open .drawer{transform:translateY(0)}
.gloss{position:absolute;inset:0;border-radius:20px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 22%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 100%)}
.floor{position:absolute;left:50%;bottom:34px;width:200px;margin-left:-100px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(8,42,107,.5),transparent);filter:blur(4px)}
.stage-title{text-align:center;margin-top:-2px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}.dots i.on{width:22px;border-radius:4px;background:var(--accent)}

.zone-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;border-radius:15px;font-weight:600;text-align:start;border:1px solid transparent;transition:background .2s}

/* ---------- pantry: wood + gold ---------- */
.fr.wood{background:linear-gradient(100deg,#4a2e14,#7a4d24 16%,#a8733a 40%,#c4914f 50%,#a8733a 60%,#7a4d24 84%,#4a2e14);

/* ---------- segmented, bars, stat cards ---------- */
.stat{display:flex;flex-direction:column;gap:2px;text-align:start;width:100%;padding:14px;border-radius:20px;position:relative;transition:transform .15s}
.stat:active{transform:scale(.98)}
.stat b{font-family:var(--font-d);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-weight:600;font-size:13px}
.stat .go{position:absolute;top:12px;inset-inline-end:12px;color:var(--muted)}
.bar{height:12px;border-radius:7px;background:color-mix(in srgb,var(--fg) 8%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}

.num{font-variant-numeric:tabular-nums}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:transparent;transition:all .2s}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.stepper input{width:90px;text-align:center;font-weight:700;font-size:20px}
.ring-wrap{display:grid;place-items:center}
.hero{border-radius:28px;padding:20px;background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 88%,#000),var(--accent-2));color:#fff;box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 35%,transparent);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -30px -60px auto;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent)}
.warnbox{border-radius:18px;padding:14px;background:var(--warn-bg);color:var(--fg);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.sugg{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;text-align:start}
.sugg:hover,.sugg:focus-visible{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ing-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}

.step-n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}

.sharebox{width:100%;min-height:200px;border-radius:16px;border:1px solid var(--line);background:var(--surface-solid);padding:12px;font:inherit;font-size:14px;line-height:1.6;white-space:pre-wrap;resize:vertical}

/* ---------- v3: dvh viewport, 48px touch targets, narrow screens ---------- */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
@supports (height:100dvh){.app{height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}}
button,[role="button"]{min-width:48px;min-height:48px}
.btn,select,.field,input:not([type="checkbox"]):not([type="radio"]):not([type="file"]){min-height:48px}
.iconbtn{width:48px;height:48px}
.stepper button{width:48px;height:48px}
.grip{width:48px;height:48px}
.pill{display:inline-flex;align-items:center;justify-content:center}
.check{width:48px;height:48px;border:0;background:none;position:relative;border-radius:50%;color:transparent}
.check::before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px solid var(--muted);transition:all .2s}
.check svg{position:relative}
.check.on{background:none;color:#fff}
.check.on::before{background:var(--ok);border-color:var(--ok)}
.item-card{border-radius:18px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px;width:100%}
.item-main{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:6px 4px;border-radius:14px}
.qty-row{display:flex;align-items:center;gap:8px;padding:0 4px}
.qbtn{width:56px;height:48px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);transition:transform .12s}
.qbtn:active{transform:scale(.9)}
.qbtn.minus{background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg)}
.qval{flex:1;min-width:0;text-align:center;font-family:var(--font-d);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.qval small{display:block;font-family:var(--font-b);font-weight:600;font-size:12px;color:var(--muted)}
.shimmer{background:linear-gradient(90deg,color-mix(in srgb,var(--fg) 7%,transparent) 25%,color-mix(in srgb,var(--fg) 16%,transparent) 50%,color-mix(in srgb,var(--fg) 7%,transparent) 75%);background-size:200% 100%;animation:shim 1.4s linear infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border-radius:16px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.gbtn:disabled{opacity:.55}
.avatar{border-radius:50%;object-fit:cover;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;flex:none}
.who-name{display:none;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:14px}
@media(min-width:380px){.who-name{display:inline;max-width:84px}.iconbtn.wide{width:auto;padding:0 10px;gap:8px}}
@media(min-width:440px){.who-name{max-width:120px}}
.syncdot{position:absolute;bottom:6px;inset-inline-end:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface-solid);background:var(--muted)}
.syncdot.synced{background:var(--ok)}.syncdot.syncing{background:var(--warn)}.syncdot.error{background:var(--bad)}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;border:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:20px;background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--accent);font-weight:700;cursor:pointer;text-align:center;padding:12px}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.toast.up{bottom:calc(164px + env(safe-area-inset-bottom,0px))}
.toast span button{margin-inline-start:12px;color:var(--accent-2);font-weight:800;min-height:48px;padding:0 8px}
@media(max-width:380px){
  body{font-size:15px}.brand{font-size:19px}.brand i{width:30px;height:30px}.card{padding:12px}.hero{padding:16px}
  .text-2xl{font-size:1.35rem!important}.stat b{font-size:22px}.nav button{font-size:11px;padding:8px 2px}.sheet{padding-inline:14px}
  .item-main .emo{width:40px;height:40px;font-size:21px}.qbtn{width:52px}.portion button{font-size:12px}
}
/* ===== v4/v5 additions ===== */
.nav-in{grid-template-columns:1fr 1fr 78px 1fr 1fr!important}
.fab-slot{display:block}
.nav .fab{position:absolute;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:68px;height:68px;border-radius:50%;padding:0;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--accent-2),var(--accent));box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 50%,transparent),0 0 0 6px var(--bg);transition:transform .2s;gap:0;font-size:0}
.nav .fab:active{transform:translateX(-50%) scale(.92)}
.nav .fab svg{display:block}
.nav button{min-height:48px}
.scanbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;border-radius:20px;text-align:start;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 35%,transparent)}
.scanbtn small{display:block;font-weight:500;opacity:.9;font-size:12px}
.filterbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin-inline:-2px}
.filterbar::-webkit-scrollbar{display:none}
.filterbar .pill{min-height:48px;display:inline-flex;align-items:center;gap:6px;flex:none}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink,#fff);border-color:transparent}
.pill-n{font-size:11px;opacity:.8}
.switch{position:relative;flex:none;width:56px;height:48px;display:grid;place-items:center}
.switch i{display:block;width:52px;height:30px;border-radius:16px;background:color-mix(in srgb,var(--fg) 18%,transparent);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:inset-inline-start .2s}
.switch.on i{background:var(--ok)}
.switch.on i::after{inset-inline-start:25px}
.ing-mod{display:block;padding:2px 0;border-bottom:1px solid var(--line)}
.ing-mod>div:first-child{min-height:52px}
.swipestack{position:relative;height:340px;margin:4px 0;touch-action:pan-y}
.swipecard{position:absolute;inset:0;border-radius:28px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none;touch-action:pan-y;cursor:grab}
.swipe-tag{position:absolute;top:16px;padding:6px 14px;border-radius:12px;font-weight:800;border:2px solid}
.swipe-tag.yes{inset-inline-start:16px;color:var(--ok)}.swipe-tag.no{inset-inline-end:16px;color:var(--bad)}
.roundbtn{width:64px;height:64px;border-radius:50%;font-size:26px;display:grid;place-items:center;background:var(--surface-solid);box-shadow:var(--shadow);border:2px solid var(--line)}
.roundbtn.yes{border-color:var(--ok)}.roundbtn.no{border-color:var(--bad);color:var(--bad)}
.hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hub-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:132px;padding:14px 10px;border-radius:24px;text-align:center}
.hub-tile b{font-size:15px;line-height:1.25}.hub-tile small{color:var(--muted);font-size:12px;line-height:1.35}
.hub-e{font-size:34px;line-height:1}
.cmdbar{display:flex;align-items:center;gap:6px;padding:6px;border-radius:22px}
.cmdbar .mic,.cmdbar .cmdgo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.cmdbar .mic{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.cmdbar .mic.on,.mic.listening{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.cmdbar .cmdgo{background:var(--accent);color:var(--accent-ink,#fff)}
.cmdin{flex:1;min-width:0;min-height:48px;background:none;border:0;outline:0;padding:0 6px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 50%,transparent)}50%{box-shadow:0 0 0 10px transparent}}
.pickcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:92px;padding:8px 4px;border-radius:16px;border:2px solid var(--line);background:var(--surface-solid);text-align:center}
.pickcell small{font-size:10px;color:var(--muted);line-height:1.2}
.pickcell[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface-solid))}
.devprev{display:flex;justify-content:center;max-height:260px;overflow:hidden;border-radius:20px;background:color-mix(in srgb,var(--fg) 5%,transparent);padding:10px}
.pathcard{display:flex;align-items:center;gap:12px;padding:12px;min-height:64px;border-radius:20px;border:2px solid transparent;width:100%}
.pathcard.on{border-color:var(--accent)}
.pathcard .check.on{background:var(--accent);border-color:var(--accent);color:#fff}
.missline{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--warn-bg);font-size:14px}
.gstrip{display:flex;align-items:center;gap:8px;width:100%;min-height:56px;padding:8px 14px;border-radius:20px}
.streakchip{display:inline-flex;align-items:center;gap:4px;min-height:48px;min-width:48px;justify-content:center;padding:0 10px;border-radius:16px;background:var(--warn-bg);font-size:15px}
.badge-card{text-align:center;opacity:.8}.badge-card.got{opacity:1;border-color:var(--ok)}
.badge-e{display:block;font-size:34px;margin-bottom:2px}
.rew-on{border-color:var(--accent)}
.onb{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;background:linear-gradient(170deg,var(--bg),var(--bg2));height:100vh;height:100dvh;padding:calc(10px + env(safe-area-inset-top,0px)) 0 calc(14px + env(safe-area-inset-bottom,0px));overflow:hidden}
.onb-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.onb-top .btn{min-height:48px}
.onb-track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onb-track::-webkit-scrollbar{display:none}
.onb-card{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 28px;gap:10px}
.onb-art{position:relative;width:min(62vw,240px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);margin-bottom:8px}
.onb-big{font-size:min(26vw,104px);line-height:1}
.onb-fl{position:absolute;font-size:30px;animation:flo 3.4s ease-in-out infinite}
.onb-fl.f0{top:6%;inset-inline-start:8%}.onb-fl.f1{top:14%;inset-inline-end:4%;animation-delay:.8s}.onb-fl.f2{bottom:6%;inset-inline-end:14%;animation-delay:1.6s}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.onb-t{font-family:var(--font-d);font-size:1.5rem;line-height:1.25;margin:0}
.onb-d{margin:0;color:var(--muted);line-height:1.6;max-width:34ch}
.onb-bot{padding:0 20px;display:flex;flex-direction:column;gap:10px}
.onb-dots{display:flex;justify-content:center}
.onb-dots button{width:48px;height:32px;display:grid;place-items:center}
.onb-dots i{display:block;width:8px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--fg) 25%,transparent);transition:all .25s}
.onb-dots i.on{width:26px;background:var(--accent)}
.onb-setup{flex:1;overflow-y:auto;padding:12px 18px 8px;display:flex;flex-direction:column}
@media (prefers-reduced-motion: reduce){.onb-fl,.cmdbar .mic.on{animation:none}}
@media(max-width:380px){.nav .fab{width:62px;height:62px}.nav-in{grid-template-columns:1fr 1fr 70px 1fr 1fr!important}.hub-tile{min-height:120px}}
.onb,.onb *,.hub-tile,.swipecard,.cmdbar,.cmdbar *{box-sizing:border-box}
.scroll-x>*{flex:none}

/* ===== v6: spatial appliance, product badges, location bar, album ===== */
.pb{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;font-size:15px;line-height:1;background:rgba(255,255,255,.85);flex:none;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}

.dcount.warn{background:#f59e0b}.dcount.bad{background:#ef4444}
.drawer{min-height:34px}
.filterbar .locname{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.suggbox{position:absolute;z-index:40;inset-inline:0;margin-top:4px;padding:6px;border-radius:18px;max-height:290px;overflow-y:auto}
form>div,.field-wrap{position:relative}

.fr.big{width:min(100%,340px);height:480px;margin:0 auto}

.paper{--pl:rgba(80,120,185,.42);position:relative;border-radius:10px 10px 18px 18px;overflow:hidden;color:#26324a;background-color:#fffaec;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"),linear-gradient(180deg,rgba(255,255,255,.55),transparent 120px);box-shadow:0 14px 34px rgba(10,20,50,.28),0 2px 0 rgba(0,0,0,.06);border:1px solid rgba(120,100,60,.22)}

/* ===== v16: welcome + quick-add ===== */
body.onb-open .scrim{z-index:150}
.wlc{background:radial-gradient(120% 80% at 80% 0%,#fb923c 0,transparent 55%),radial-gradient(100% 70% at 0% 100%,#ec4899 0,transparent 55%),linear-gradient(160deg,#4338ca,#7c3aed 55%,#be185d);color:#fff;overflow:hidden}
.wlc-bg{position:absolute;inset:0;pointer-events:none}
.wlc-f{position:absolute;font-size:34px;opacity:.5;animation:wlcf 7s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.w0{top:8%;left:10%}.w1{top:14%;right:12%;animation-delay:-1s}.w2{top:34%;left:4%;animation-delay:-2s}.w3{top:30%;right:5%;animation-delay:-3s}.w4{top:52%;left:12%;animation-delay:-4s}.w5{top:50%;right:10%;animation-delay:-5s}.w6{top:70%;left:6%;animation-delay:-2.5s}.w7{top:68%;right:8%;animation-delay:-1.5s}
@keyframes wlcf{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.wlc-f{animation:none}}
.wlc-main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px;gap:10px}
.wlc-logo{display:grid;place-items:center;width:84px;height:84px;border-radius:26px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);box-shadow:0 14px 34px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.5)}
.wlc-t{font-family:var(--font-d);font-size:clamp(34px,10vw,46px);line-height:1.1;font-weight:900;margin:4px 0;text-shadow:0 4px 18px rgba(0,0,0,.3)}
.wlc-d{max-width:30ch;margin:0;font-size:17px;line-height:1.55;opacity:.95}
.wlc-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}.wlc-pills span{padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);font-weight:700;font-size:14px}
.wlc-bot{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.wlc-cta{min-height:58px;border:0;border-radius:20px;background:#fff;color:#4338ca;font-weight:900;font-size:19px;font-family:var(--font-d);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.wlc-sec{min-height:48px;border:1px solid rgba(255,255,255,.4);border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.wlc-skip{min-height:48px;border:0;background:none;color:rgba(255,255,255,.8);font-size:14px;cursor:pointer;text-decoration:underline}
.qa{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:20px}
.qa-bar{display:flex;align-items:center;gap:8px;min-height:56px;padding:0 12px;border-radius:16px;background:var(--surface-solid,#fff);border:2px solid var(--accent);font-size:20px}
.qa-in{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:17px;min-height:52px;color:inherit;font-family:inherit}
.qa-x{width:48px;height:48px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
.qa-dest{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.qa-lbl{font-size:13px;font-weight:700;color:var(--muted)}
.qa-list{list-style:none;margin:0;padding:4px;display:flex;flex-direction:column;gap:2px;border-radius:16px;background:var(--surface-solid,#fff);box-shadow:0 8px 24px rgba(15,23,42,.18)}
.qa-row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:inherit;font-size:16px;font-weight:700;cursor:pointer}
.qa-row.hi,.qa-row:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}.qa-row.got{opacity:.6}
.qa-e{font-size:28px;width:34px;text-align:center}.qa-plus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:20px;font-weight:800}
.qa-picks{margin-top:12px}.qa-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 10px;border-radius:99px;background:var(--surface-solid,#fff);border:1px solid var(--line,rgba(0,0,0,.15));min-height:48px}
.qa-d{min-height:48px;min-width:48px;padding:0 12px;border:0;border-radius:99px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:800;font-size:12px;cursor:pointer}
.qa-rm{width:48px;height:48px;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer}

/* ===== Round M ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#root{height:100dvh;height:100%;overflow:hidden}
@supports(height:100dvh){#root{height:100dvh}}
.main{overflow-y:auto;overscroll-behavior-y:none;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.sheet,.sheet *{overscroll-behavior:contain}
.acc{border:1px solid var(--line,rgba(0,0,0,.1));border-radius:18px;background:var(--surface-solid,transparent);overflow:hidden}
.acc.sub{border-radius:14px;margin-bottom:8px}
.acc-h{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;border:0;background:none;color:inherit;font:inherit;font-weight:800;font-size:16px;cursor:pointer;text-align:start}
.acc.sub .acc-h{min-height:48px;font-size:15px}
.acc-c{display:grid;place-items:center;transition:transform .2s}
.acc.open>.acc-h .acc-c{transform:rotate(-90deg)}
.acc-b{padding:4px 16px 16px}
.shop-head{display:flex;align-items:center;gap:10px}
.shop-head h1{margin:0}
.shop-share{width:48px;height:48px;flex:none}
.shop-cnt{margin-inline-start:auto}
.shop-fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;min-height:52px;padding:0 24px;border:0;border-radius:99px;background:var(--accent);color:#fff;font:inherit;font-weight:800;font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.28);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.shop-fab:disabled{opacity:.45}
.shop-total{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.st-l{display:flex;flex-direction:column}.st-t{font-size:13px;color:var(--muted)}.st-v{font-size:22px}
.st-btn{min-height:48px}
.cmp-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.cmp-row.best{background:var(--ok-bg);border-color:var(--ok)}
.cmp-v small{color:var(--muted);margin-inline-start:6px}
.paper .psec{margin-top:18px}
.paper .psech{border-bottom:2px solid rgba(29,42,74,.22);margin-bottom:10px;padding-bottom:8px}
.paper .phead{gap:6px;align-items:center}.paper .phead .ptitle{white-space:nowrap;flex:0 1 auto}
.paper .shop-share{width:44px;height:44px;min-width:44px;flex:none;background:transparent;box-shadow:none;border:0;color:#1d2a4a}
@media(max-width:380px){.paper .phead{padding-inline-start:44px}.paper .phead .ptitle{font-size:19px}}

/* ===== Round N: compact visual view ===== */
.dv-compact{height:232px;overflow:visible;position:relative}
.dv-compact .stage{transform:scale(.58);transform-origin:top center;margin-top:-18px}
.dv-title{margin-top:0}
.dv-title h1{margin:0}

/* ===== Round O: ledger ===== */
.ledger-sum{display:flex;gap:10px;margin-bottom:12px}.ledger-sum>div{flex:1;border-radius:16px;padding:10px 12px;background:var(--surface-solid,rgba(0,0,0,.04));display:flex;flex-direction:column}.ledger-sum small{color:var(--muted)}.ledger-sum b{font-size:20px}
.ledger-day{position:sticky;top:0;z-index:1;padding:8px 4px;font-weight:800;font-size:13px;color:var(--muted);background:var(--bg,#fff)}
.ledger-row{display:flex;gap:12px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line,rgba(0,0,0,.1))}
.ledger-main{min-width:0;flex:1}.ledger-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.ledger-name{font-family:var(--font-d);overflow-wrap:anywhere}
.ledger-amt.pos{color:var(--ok)}.ledger-amt.neg{color:var(--bad)}.ledger-kind{font-size:13px;font-weight:700;margin-top:2px}.ledger-detail{font-size:13px;color:var(--muted);line-height:1.5;margin-top:2px}.ledger-time{font-size:12px;color:var(--muted);margin-top:4px}

.zsub{margin-top:8px;display:flex;flex-direction:column;gap:8px}.zsub-h{font-weight:800;font-size:14px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center}
.zbadge{font-weight:700}

/* ===== Round Q: price breakdown ===== */
.cmp-src{display:flex;gap:6px;align-items:center;min-height:44px;padding:6px 12px;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.12));background:transparent;color:inherit;font:inherit;font-size:13px;text-align:start;cursor:pointer}
.cmp-info{margin:8px 0 0;font-size:13px;line-height:1.6;color:var(--muted)}
.cmp-scroll{overflow-x:auto;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.12));overscroll-behavior-x:contain}
.cmp-tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13px}
.cmp-tbl th,.cmp-tbl td{padding:9px 10px;border-bottom:1px solid var(--line,rgba(0,0,0,.08));text-align:center;white-space:nowrap}
.cmp-tbl thead th{background:rgba(0,0,0,.04);font-size:12px}
.cmp-tbl th[scope=row]{text-align:start;position:sticky;inset-inline-start:0;background:var(--bg,#fff);min-width:120px;white-space:normal}
.cmp-tbl th[scope=row] small{display:block;color:var(--muted);font-weight:400}
.cmp-tbl td.min{color:var(--ok);font-weight:800;background:var(--ok-bg)}
.cmp-tbl sup{font-size:9px;margin-inline-start:2px;color:var(--muted)}
.cmp-tbl tfoot td,.cmp-tbl tfoot th{border-bottom:0;font-weight:800}

/* ===== Round R: settings master-detail, price portal ===== */
.sheet:has(.sd){max-width:920px}
.sd{display:grid;grid-template-columns:1fr;gap:16px}
.sd-nav{display:flex;flex-direction:column;gap:8px}
.sd-item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:16px;border:1px solid var(--line,rgba(0,0,0,.1));background:var(--surface-solid,transparent);color:inherit;font:inherit;font-weight:700;font-size:16px;cursor:pointer;text-align:start}
.sd-n{flex:1}.sd-e{font-size:22px}.sd-c{opacity:.5}
.sd-item[aria-current=page]{background:var(--accent);color:#fff;border-color:transparent}
.sd-ph{display:flex;align-items:center;gap:8px}.sd-ph h3{margin:0}
.sd-back{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.06);color:inherit;cursor:pointer;display:grid;place-items:center;transform:scaleX(-1)}
html[dir=ltr] .sd-back{transform:none}
.sd.has-cat .sd-nav{display:none}
.sd-sub{padding:14px;border-radius:16px;border:1px solid var(--line,rgba(0,0,0,.1))}
.sd-sh{margin:0;font-weight:800;font-size:15px}
.sd-site-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.12));color:inherit;text-decoration:none}
.sd-site-a span.num{color:var(--muted);font-size:12px;flex:1}
.sd-regions{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sd-reg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 12px;border-radius:14px;border:1px solid var(--line,rgba(0,0,0,.12));background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:start}
.sd-reg small{color:var(--muted)}.sd-reg[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
@media(min-width:760px){.sd{grid-template-columns:240px 1fr;align-items:start}.sd.has-cat .sd-nav{display:flex}.sd-back{display:none}.sd-nav{position:sticky;top:0}}
.shop-cmp{width:100%;min-height:52px;justify-content:center;margin-top:14px;text-decoration:none}

/* ===== Round R: offline, native feel, region list, fallback ===== */
.sd-regions{display:flex;flex-direction:column;gap:0;max-height:288px;overflow-y:auto;overscroll-behavior:contain;border:1px solid var(--line,rgba(0,0,0,.12));border-radius:16px;-webkit-overflow-scrolling:touch}
.sd-reg{flex-direction:row;align-items:center;gap:12px;min-height:52px;width:100%;border:0;border-radius:0;border-bottom:1px solid var(--line,rgba(0,0,0,.08));text-align:start}
.sd-reg:last-child{border-bottom:0}.sd-reg>span:first-child{font-size:24px}.sd-reg small{margin-inline-start:auto;font-size:12px}
.sd-reg[aria-pressed=true]{box-shadow:none;background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:800}
.sd-reg[aria-pressed=true]::after{content:"✓";color:var(--accent);font-weight:800}
.offline-pill{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%);z-index:80;display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;background:rgba(15,23,42,.88);color:#fff;font-size:12px;font-weight:700;pointer-events:none}
.shop-cmp{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-top:12px}.shop-cmp[disabled]{opacity:.55}.shop-cmp small{font-weight:400;font-size:11px}
.ks-fallback{text-align:center;padding:40px 20px}
html{-webkit-tap-highlight-color:transparent}
.plat-ios button,.plat-ios a,.plat-ios .sd-reg{transition:opacity .12s}
.plat-ios button:active:not(:disabled),.plat-ios a:active,.plat-ios [role=button]:active{opacity:.55}
.plat-ios,.plat-ios body{-webkit-touch-callout:none}
.plat-android .ks-ripple{position:relative;overflow:hidden}
.ks-rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:ksrip .55s ease-out forwards;pointer-events:none}
@keyframes ksrip{to{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.ks-rip{animation:none;opacity:0}}
.standalone .main{-webkit-user-select:none;user-select:none}.standalone input,.standalone textarea{-webkit-user-select:text;user-select:text}

.cmp-steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:10px}
.cmp-steps li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,transparent);line-height:1.5}
.cmp-steps b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff}
.toast span{font-weight:700}

/* ===== Round S ===== */
.adv{border:1px solid var(--line,rgba(0,0,0,.12));border-radius:16px;padding:0 14px;margin-bottom:12px}.adv summary{min-height:48px;display:flex;align-items:center;font-weight:800;cursor:pointer}.adv[open] summary{margin-bottom:8px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.plan{position:relative;display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:start;min-height:84px;padding:12px;border-radius:16px;border:2px solid var(--line,rgba(0,0,0,.12));background:transparent;color:inherit;font:inherit;cursor:pointer}.plan small{color:var(--muted)}.plan-b{position:absolute;top:8px;inset-inline-end:8px;font-style:normal;font-size:11px;font-weight:800;background:var(--accent);color:#fff;border-radius:99px;padding:2px 8px}
.gph .gfb{position:absolute;inset:0 0 38% 0;display:grid;place-items:center;font-size:42px;z-index:0;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
